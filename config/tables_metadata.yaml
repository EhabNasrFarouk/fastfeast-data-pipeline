Batch:

  customers:
      not_null:
        customer_id:  CRITICAL   
        region_id:    CRITICAL   
        signup_date:  CRITICAL   
        full_name:    CRITICAL  
        segment_id:   WARNING   
        phone:        WARNING   
        gender:       WARNING    
        email:        WARNING    

      data_types:
        customer_id:  pl.Int64
        full_name:  pl.Utf8
        email:  pl.Utf8
        phone:  pl.Utf8
        region_id:  pl.Int64
        segment_id: pl.Int64
        signup_date:  pl.Date
        gender: pl.Utf8
        created_at: pl.Timestamp    
        updated_at: pl.Time   

      unique:    [customer_id]
      regex:
        email: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        phone: '^01[0-25][0-9]{8}$'

      allowed_values:
        gender: [male, female]

      foreign_keys:
        region_id:  regions.region_id
        segment_id: segments.segment_id

      pii:
        full_name: mask
        email: mask
        phone: mask

  drivers:
    not_null:
      driver_id:              CRITICAL 
      national_id:            CRITICAL  
      region_id:               CRITICAL  
      driver_name:              CRITICAL  
      shift:                    WARNING   
      vehicle_type:             WARNING   
      hire_date:                WARNING   
      driver_phone:              WARNING   
      rating_avg:                WARNING   
      on_time_rate:               WARNING   
      cancel_rate:                 WARNING   
      completed_deliveries:         WARNING   
      is_active:                     WARNING   

    data_types:
      driver_id:  pl.Int64
      driver_name:  pl.Utf8
      driver_phone: pl.Utf8
      national_id:  pl.Utf8
      region_id:  pl.Int64
      shift:  pl.Utf8
      vehicle_type: pl.Utf8
      hire_date:  pl.Date
      rating_avg: pl.Decimal
      on_time_rate: pl.Decimal
      cancel_rate:  pl.Decimal
      completed_deliveries: pl.Int64
      is_active:  pl.Boolean
      created_at: pl.Timestamp  
      updated_at: pl.Time

    unique:   [driver_id, national_id]  
    range:
      rating_avg:            [1.0, 5.0, WARNING]
      on_time_rate:          [0.0, 1.0, WARNING]
      cancel_rate:           [0.0, 1.0, WARNING]
      completed_deliveries:  [0, INF, WARNING]
    allowed_values:
      shift:        [morning, evening, night]
      vehicle_type: [bike, motorbike, car]
    regex:
      driver_phone: '^01[0-25][0-9]{8}$'
      national_id: '^[2-3][0-9]{13}$'
    foreign_keys:
      region_id: regions.region_id

    pii:
      driver_name: mask
      driver_phone: mask
      national_id: hash

  restaurants:
    not_null:
      restaurant_id:      CRITICAL  
      region_id:            CRITICAL 
      category_id:            CRITICAL  
      restaurant_name:          WARNING   
      price_tier:                 WARNING   
      is_active:                    WARNING  
      rating_avg:                     WARNING   
      prep_time_avg_min:                 WARNING  

    data_types:
      restaurant_id:  pl.Int64
      restaurant_name:  pl.Utf8
      region_id:  pl.Int64
      category_id:  pl.Int64
      price_tier: pl.Utf8
      rating_avg: pl.Decimal
      prep_time_avg_min:  pl.Int64
      is_active:  pl.Boolean
      created_at: pl.Timestamp  
      updated_at: pl.Timestamp  

    unique:   [restaurant_id]
    range:
      rating_avg:         [1.0, 5.0, WARNING]
      prep_time_avg_min:  [0, INF, WARNING]
    allowed_values:
      price_tier: [Low, Mid, High]
    foreign_keys:
      region_id:   regions.region_id
      category_id: categories.category_id

  agents:
    not_null:
      agent_id:                CRITICAL  
      team_id:                   CRITICAL  
      agent_name:                  CRITICAL  
      agent_phone:                  WARNING   
      agent_email:                    WARNING  
      skill_level:                    WARNING  
      is_active:                        WARNING   
      hire_date:                          WARNING  
      avg_handle_time_min:                  WARNING   
      resolution_rate:                        WARNING   
      csat_score:                               WARNING   

    data_types:
      agent_id: pl.Int64
      agent_name: pl.Utf8
      agent_email:  pl.Utf8
      agent_phone:  pl.Utf8
      team_id:  pl.Int64
      skill_level:  pl.Utf8
      hire_date:  pl.Date
      avg_handle_time_min:  pl.Int64
      resolution_rate:  pl.Decimal
      csat_score: pl.Decimal
      is_active:  pl.Boolean
      created_at: pl.Timestamp  
      updated_at: pl.Time   

    unique:   [agent_id]

    range:
      avg_handle_time_min: [0, INF, WARNING]
      resolution_rate:     [0.0, 1.0, WARNING]
      csat_score:           [0.0, 5.0, WARNING]

    allowed_values:
      skill_level: [Junior, Mid, Senior, Lead]

    regex:
      agent_email: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
      agent_phone: '^1[0-25][0-9]{8}$'

    foreign_keys:
      team_id: teams.team_id

    pii:
      agent_name: mask
      agent_email: mask
      agent_phone: mask

  cities:
    not_null:
      city_id:    CRITICAL
      city_name:  CRITICAL
      country:    CRITICAL
      timezone:   CRITICAL
    unique: [city_id]
    data_types:
      city_id:  pl.Int64
      city_name:  pl.Utf8
      country:  pl.Utf8
      timezone: pl.Utf8

  regions:
    not_null:
      region_id:           CRITICAL
      region_name:         CRITICAL
      city_id:             CRITICAL
      delivery_base_fee:   CRITICAL
    unique: [region_id]
    data_types:
      region_id: pl.Int64
      region_name: pl.Utf8
      city_id: pl.Int64
      delivery_base_fee: pl.Decimal
    range:
      delivery_base_fee: [0.0, 200, CRITICAL]
    foreign_keys:
      city_id: cities.city_id

  categories:
    not_null:
      category_id:    CRITICAL
      category_name:  CRITICAL
    unique: [category_id]
    data_types:
      category_id: pl.Int64
      category_name: pl.Utf8

  reason_categories:
    not_null:
      reason_category_id:  CRITICAL
      category_name:       CRITICAL
    unique: [reason_category_id]
    data_types:
      reason_category_id: pl.Int64
      category_name: pl.Utf8

  reasons:
    not_null:
      reason_id:            CRITICAL
      reason_name:          CRITICAL
      reason_category_id:   CRITICAL
      severity_level:       CRITICAL
      typical_refund_pct:   CRITICAL
    unique: [reason_id]
    data_types:
      reason_id: pl.Int64
      reason_name: pl.Utf8
      reason_category_id: pl.Int64
      severity_level: pl.Int64
      typical_refund_pct: pl.Decimal
    range:
      severity_level:       [1, 5, WARNING]
      typical_refund_pct:   [0.0, 1.0, WARNING]
    foreign_keys:
      reason_category_id: reason_categories.reason_category_id

  segments:
    not_null:
      segment_id:         CRITICAL
      segment_name:       CRITICAL
      discount_pct:       CRITICAL
      priority_support:   CRITICAL
    unique: [segment_id]
    data_types:
      segment_id: pl.Int64
      segment_name: pl.Utf8
      discount_pct: pl.Int64
      priority_support: pl.Boolean

    range:
      discount_pct: [0, 100, CRITICAL]

  teams:
    not_null:
      team_id:    CRITICAL
      team_name:  CRITICAL
    unique: [team_id]
    data_types:
      team_id: pl.Int64
      team_name: pl.Utf8

  channels:
    not_null:
      channel_id:    CRITICAL
      channel_name:  CRITICAL
    unique: [channel_id]
    data_types:
      channel_id: pl.Int64
      channel_name: pl.Utf8

  priorities:
    not_null:
      priority_id:              CRITICAL
      priority_code:            CRITICAL
      priority_name:            CRITICAL
      sla_first_response_min:   CRITICAL
      sla_resolution_min:       CRITICAL
    unique: [priority_id]
    data_types:
      priority_id: pl.Int64
      priority_code:  pl.Utf8
      priority_name:  pl.Utf8
      sla_first_response_min: pl.Int64
      sla_resolution_min: pl.Int64
    range:
      sla_first_response_min: [0, 1440, WARNING]
      sla_resolution_min:     [0, 1440, WARNING]


Stream:

  orders:
    not_null:
      order_id:            CRITICAL  
      customer_id:         CRITICAL 
      restaurant_id:       CRITICAL 
      driver_id:           CRITICAL 
      region_id:           CRITICAL 
      order_status:        CRITICAL  
      payment_method:      CRITICAL  
      order_amount:        CRITICAL  
      delivery_fee:        CRITICAL  
      discount_amount:     CRITICAL  
      total_amount:        CRITICAL  
      order_created_at:    CRITICAL  
      delivered_at:        WARNING   

    data_types:
      date_format: "%Y-%m-%d %H:%M:%S"
      order_id: pl.Utf8
      customer_id: pl.Int64
      restaurant_id: pl.Int64
      driver_id: pl.Int64
      region_id: pl.Int64
      order_amount: pl.Decimal
      delivery_fee: pl.Decimal
      discount_amount: pl.Decimal
      total_amount: pl.Decimal
      order_status: pl.Utf8
      payment_method: pl.Utf8
      order_created_at: pl.Timestamp  
      delivered_at: pl.Timestamp      

    unique:   [order_id]
    range:
      order_amount:    [0.01, 10000, CRITICAL]
      delivery_fee:    [0.0,  500, CRITICAL]
      discount_amount: [0.0,  500, CRITICAL]
      total_amount:    [0.01, 10000, CRITICAL]
    allowed_values:
      order_status:   [Delivered, Cancelled, Refunded]
      payment_method: [card, cash, wallet]
    foreign_keys:
      customer_id:   customers.customer_id
      restaurant_id: restaurants.restaurant_id
      driver_id:     drivers.driver_id
      region_id:     regions.region_id

  tickets:
    not_null:
      ticket_id:     CRITICAL 
      order_id:      CRITICAL 
      customer_id:   CRITICAL 
      agent_id:      CRITICAL 
      reason_id:     CRITICAL
      priority_id:   CRITICAL  
      channel_id:    CRITICAL 
      status:        CRITICAL  
      created_at:    CRITICAL 
      driver_id:     WARNING   
      restaurant_id: WARNING   

    data_types:
      float_to_int: True
      date_format: "%Y-%m-%d %H:%M:%S"
      ticket_id: pl.Utf8
      order_id: pl.Utf8
      customer_id: pl.Int64
      driver_id: pl.Int64
      restaurant_id: pl.Int64
      agent_id: pl.Int64
      reason_id: pl.Int64
      priority_id: pl.Int64
      channel_id: pl.Int64
      status: pl.Utf8
      refund_amount: pl.Decimal
      created_at: pl.Timestamp         
      first_response_at: pl.Timestamp  
      resolved_at: pl.Timestamp        
      sla_first_due_at: pl.Timestamp   
      sla_resolve_due_at: pl.Timestamp 

    unique:   [ticket_id]
    allowed_values:
      status: [Open, InProgress, Resolved, Closed, Reopened]
    range:
      refund_amount: [0.0, 10000, CRITICAL]
    foreign_keys:
      order_id:      orders.order_id
      customer_id:   customers.customer_id
      agent_id:      agents.agent_id
      reason_id:     reasons.reason_id
      priority_id:   priorities.priority_id
      channel_id:    channels.channel_id
      driver_id:     drivers.driver_id     
      restaurant_id: restaurants.restaurant_id 

  ticket_events:
    not_null:
      event_id:    CRITICAL  
      ticket_id:   CRITICAL 
      agent_id:    CRITICAL  
      event_ts:    CRITICAL
      new_status:  CRITICAL  

    data_types:
      date_format: "%Y-%m-%d %H:%M:%S"
      event_id: pl.Utf8
      ticket_id: pl.Utf8
      agent_id: pl.Int64
      event_ts: pl.Timestamp   
      old_status: pl.Utf8
      new_status: pl.Utf8
      notes: pl.Utf8

    unique: [event_id]
    allowed_values:
      status: [Open, InProgress, Resolved, Closed, Reopened]  
    foreign_keys:
      ticket_id: tickets.ticket_id
      agent_id:  agents.agent_id